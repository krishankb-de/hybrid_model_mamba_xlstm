name: Willi Parity Check

# Gates the a100_70m_baseline branch.
# CPU-only runner validates: syntax, PEP-604/585 compatibility,
# dependency install, unit tests, Hydra config invariants, and a 2-step dry-run.
# No GPU required — catches willi-incompatible code before it hits the server.

on:
  push:
    branches:
      - a100_70m_baseline
  pull_request:
    branches:
      - a100_70m_baseline

jobs:
  willi-parity:
    name: "Willi Parity (Python 3.9.23 / CPU)"
    runs-on: ubuntu-latest
    timeout-minutes: 30

    steps:
      # ── 1. Checkout ──────────────────────────────────────────────────────────
      - name: Checkout repository
        uses: actions/checkout@v4

      # ── 2. Python 3.9.23 ─────────────────────────────────────────────────────
      - name: Set up Python 3.9.23
        uses: actions/setup-python@v5
        with:
          python-version: "3.9.23"

      # ── 3. Pip cache ──────────────────────────────────────────────────────────
      - name: Cache pip
        uses: actions/cache@v4
        with:
          path: ~/.cache/pip
          key: willi-pip-${{ hashFiles('requirements.txt', 'setup.py') }}
          restore-keys: |
            willi-pip-

      # ── 4. Install CPU torch first (avoids pulling CUDA build) ───────────────
      - name: Install CPU PyTorch
        run: |
          python -m pip install --upgrade pip
          pip install torch==2.1.2 --index-url https://download.pytorch.org/whl/cpu

      # ── 5. Install project and deps ───────────────────────────────────────────
      - name: Install project dependencies
        run: |
          pip install -e .
          # Install requirements but skip packages that require CUDA compilation
          grep -v -E "^(triton|flash-attn|apex)" requirements.txt > /tmp/reqs_ci.txt || true
          pip install -r /tmp/reqs_ci.txt || pip install -r requirements.txt || true

      # ── 6. Static gates: syntax + PEP-604 + PEP-585 ──────────────────────────
      - name: Static syntax and compatibility check
        run: bash scripts/validate_for_willi.sh --ci-static-only

      # ── 7. Unit tests (no CUDA, no slow) ─────────────────────────────────────
      - name: Run CPU unit tests
        run: |
          pytest tests/ -m "not cuda and not slow" -v --tb=short

      # ── 8. Willi parity tests ─────────────────────────────────────────────────
      - name: Run willi parity tests
        run: |
          pytest tests/test_willi_parity.py -v --tb=short

      # ── 9. Model forward/backward smoke (no dataset download, no missing keys) ──
      # train.py requires a dataset download and fast_dev_run is not in the config
      # struct. Instead, directly import the model and run a forward+backward pass.
      - name: Model import + CPU forward/backward smoke
        run: |
          python - <<'PYEOF'
          import torch
          from hybrid_xmamba.models.configuration_hybrid import HybridConfig
          from hybrid_xmamba.models.hybrid_lm import HybridLanguageModel

          cfg = HybridConfig(
              vocab_size=50257, dim=64, num_layers=3,
              layer_pattern=["mamba", "mamba", "mlstm"],
              max_position_embeddings=64,
              use_fast_path=False,
              use_tfla=False,
          )
          model = HybridLanguageModel(cfg)
          model.train()

          input_ids = torch.randint(0, 50257, (2, 32))
          labels    = torch.randint(0, 50257, (2, 32))
          out = model(input_ids, labels=labels, return_dict=True)

          assert out.loss is not None, "No loss returned"
          assert torch.isfinite(out.loss), f"Loss not finite: {out.loss.item()}"
          assert torch.isfinite(out.logits).all(), "Logits contain NaN/Inf"

          out.loss.backward()
          frozen = [n for n, p in model.named_parameters() if p.requires_grad and p.grad is None]
          assert not frozen, f"Missing gradients on: {frozen[:5]}"

          print(f"OK  loss={out.loss.item():.4f}  logits={tuple(out.logits.shape)}")
          PYEOF
        timeout-minutes: 5
