# MIMIC-CXR dataset configuration for joint KD+CLIP+SimCSE training.
#
# Dataset: itsanmolgupta/mimic-cxr-dataset (~30K image-report pairs)
#   - Fields verified in Phase 4 before training; defaults below are best-guess.
#   - findings_field / impression_field: update after Phase 4 column check.
#   - Requires HF_TOKEN (MIMIC-CXR is credentialed on PhysioNet).
#
# Image encoder: microsoft/BiomedCLIP-PubMedBERT_256-vit_base_patch16_224
#   - Produces 512-dim L2-normalised image embeddings.
#   - Frozen by default (ViT unfreeze via model.vit_unfreeze_blocks).
#
# Text: reports are findings + impression concatenated (concat=true).
#   CXR reports average ~250 tokens; max_length=256 covers ~95% without truncation.

dataset_name: "mimic_cxr"
hf_repo_id: "itsanmolgupta/mimic-cxr-dataset"

# Splits — itsanmolgupta/mimic-cxr-dataset only has "train"; slice it.
# 90/10 split: ~27569 train / ~3063 val.
#
# ---------------------------------------------------------------------------
# PROTOCOL HAZARD (Phase 6F): validation_split == test_split.
# ---------------------------------------------------------------------------
# These are the SAME 3063 pairs that evaluate_cxr_retrieval.py:346 scores, so
# ANY checkpoint selection or early stopping on a val metric is selection-on-
# test. Currently mitigated only by selecting on val/total_loss rather than on
# val/retrieval_i2t_R@10 — chasing the in-training retrieval peak (0.120-0.122
# vs the authoritative 0.1113) is therefore permanently banned while these two
# splits are identical.
#
# The defaults below are UNCHANGED so every 6D arm stays directly comparable to
# the 0.1113 baseline (27570 train pairs). Phase 6F runs the fixed protocol via
# overrides only — no code change is needed, because the val loader reads
# validation_split while the authoritative eval hardcodes train[90%:]:
#
#   dataset.train_split='train[:85%]' \
#   dataset.validation_split='train[85%:90%]' \
#   dataset.test_split='train[90%:]'
#
# (SELECTION_SPLIT=true in scripts/train_biomedclip_kd_h100.sh applies exactly
# that.) Costs ~5% of the training pairs and buys a defensible selection
# protocol — and legitimises checkpoint-on-retrieval, which is otherwise
# unusable.
train_split: "train[:90%]"
validation_split: "train[90%:]"
test_split: "train[90%:]"

# Tokenization — match Stage 0 pretraining tokenizer
tokenizer: "gpt2"
max_length: 256
max_seq_length: 256

# Teacher tokenization (PubMedBERT WordPiece); populated by distill config
teacher_max_length: 512

# Data loading
# Effective batch = batch_size × accumulate_grad_batches = 16 × 8 = 128
batch_size: 16
eval_batch_size: 16
num_workers: 4
pin_memory: true
streaming: false
cache_dir: "/scratch/bhushkri/mimic_cxr_cache"

# Image preprocessing (BiomedCLIP ViT-B/16, CLIP normalisation)
image_size: 224
image_mean: [0.48145466, 0.4578275, 0.40821073]
image_std:  [0.26862954, 0.26130258, 0.27577711]

# Contrastive training settings
contrastive_mode: "joint"
image_encoder_name: "microsoft/BiomedCLIP-PubMedBERT_256-vit_base_patch16_224"

# Text fields — update after Phase 4 column verification
findings_field: "findings"
impression_field: "impression"
concatenate_sections: true
