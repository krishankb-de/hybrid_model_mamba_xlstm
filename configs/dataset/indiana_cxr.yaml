# Chest X-ray dataset configuration for Stage 2 CLIP alignment.
#
# Dataset: itsanmolgupta/mimic-cxr-dataset (public subset of MIMIC-CXR)
#   - 30,633 image-text pairs, fully open access (no credentials required)
#   - PIL Image objects embedded directly (no snapshot_download needed)
#   - Fields: image, findings, impression
#   - Single split: "train" — we carve out validation internally
#   - Original MIMIC-CXR: https://physionet.org/content/mimic-cxr/
#
# Previous dataset dz-osamu/IU-Xray failed: snapshot_download returned 401
# Unauthorized because the LFS image files are in a private/gated repo.
#
# Image encoder: microsoft/BiomedCLIP-PubMedBERT_256-vit_base_patch16_224
#   - Frozen during training (only text encoder is trained)

dataset_name: "indiana_cxr"
dataset_version: null
hf_repo_id: "itsanmolgupta/mimic-cxr-dataset"

# This dataset only has a "train" split — validation is carved out in code
train_split: "train"
validation_split: "train"
test_split: "train"

# Tokenization — match pubmed pretraining tokenizer
tokenizer: "gpt2"
max_length: 256         # Radiology reports: Findings + Impression fit in 256 tokens
max_seq_length: 256

# Data loading
batch_size: 64          # Small dataset; large batch helps contrastive learning
eval_batch_size: 64
num_workers: 4
pin_memory: true

# No streaming — dataset is small enough to cache fully
streaming: false
cache_dir: "/scratch/bhushkri/indiana_cxr_cache"

# Image preprocessing (for BiomedCLIP ViT-B/16)
image_size: 224
image_mean: [0.48145466, 0.4578275, 0.40821073]   # CLIP normalisation
image_std:  [0.26862954, 0.26130258, 0.27577711]

# Contrastive training settings
contrastive_mode: "clip"
image_encoder_name: "microsoft/BiomedCLIP-PubMedBERT_256-vit_base_patch16_224"

# Text fields in the dataset
# For PIL-based datasets (image column): findings_field + impression_field
findings_field: "findings"
impression_field: "impression"
concatenate_sections: true
# For path-based datasets (images column, e.g. dz-osamu/IU-Xray):
# report_field is the text column; image_index selects frontal (0) or lateral (1)
report_field: "response"
image_index: 0
