# Indiana University Chest X-ray dataset configuration for Stage 2 CLIP alignment.
#
# Dataset: MLforHealthcare/Indiana_University_Chest_X-ray_Collection
#   - 7,430 image-text pairs (6,687 train + 743 test)
#   - Fully public, no HF token required
#   - PIL Image objects embedded directly (no download script needed)
#   - Fields: image (PIL), question (str), report (str)
#   - This is the standard IU-Xray benchmark used in BioViL-T / BiomedCLIP papers
#
# Image encoder: microsoft/BiomedCLIP-PubMedBERT_256-vit_base_patch16_224
#   - Frozen during training (only text encoder is trained)
#   - Outputs 512-dim L2-normalised image embeddings

dataset_name: "indiana_cxr"
dataset_version: null
hf_repo_id: "MLforHealthcare/Indiana_University_Chest_X-ray_Collection"

# Splits — dataset has train and test
train_split: "train"
validation_split: "test"
test_split: "test"

# Tokenization — match pubmed pretraining tokenizer
tokenizer: "gpt2"
max_length: 256         # Radiology reports fit comfortably in 256 tokens
max_seq_length: 256

# Data loading
batch_size: 8           # Small effective batch per step; accum=8 gives eff=64
eval_batch_size: 8
num_workers: 2
pin_memory: false

# No streaming — dataset is small enough to cache fully
streaming: false
cache_dir: "/scratch/bhushkri/indiana_cxr_cache"

# Image preprocessing (for BiomedCLIP ViT-B/16)
image_size: 224
image_mean: [0.48145466, 0.4578275, 0.40821073]   # CLIP normalisation
image_std:  [0.26862954, 0.26130258, 0.27577711]

# Contrastive training settings
contrastive_mode: "clip"
image_encoder_name: "microsoft/BiomedCLIP-PubMedBERT_256-vit_base_patch16_224"

# Text fields — MLforHealthcare dataset has a single "report" field
# Set findings_field="report" and concatenate_sections=false to use it directly
findings_field: "report"
impression_field: "report"
concatenate_sections: false
