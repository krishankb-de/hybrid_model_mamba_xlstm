# PubMed Dataset Config for Colab
# Small sample (10k abstracts) for fast iteration (~2-3 hours total pipeline)

dataset_name: "ccdv/pubmed-summarization"
dataset_version: null

train_split: "train"
validation_split: "train"

# Tokenization
tokenizer: "gpt2"
max_length: 512
max_seq_length: 512

# Small batch for Colab T4
batch_size: 8
eval_batch_size: 8
num_workers: 2            # Minimal workers
pin_memory: false         # Disable on Colab (less stable)

# Streaming & caching
streaming: false
cache_dir: "./.cache_pubmed_colab"

# Text packing
pack_sequences: true

# Colab-specific: Limited samples for validation
num_train_samples: 10000   # ~30 min per epoch, 5 epochs = 2.5 hours total
num_eval_samples: 1000     # For validation PPL
