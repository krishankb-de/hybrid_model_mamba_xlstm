# Colab T4 GPU Trainer Config (Stage 1 - SimCSE Contrastive)
# For 2k steps: ~30-45 minutes
# Memory: 16GB T4 VRAM

batch_size: 16              # Larger batch for contrastive pairs
accumulation_steps: 1       # No gradient accumulation
num_workers: 2

# Learning
learning_rate: 2e-5         # Lower for fine-tuning
lr_schedule: cosine_warmup
warmup_steps: 100
weight_decay: 0.1
grad_clip: 1.0

# Training
max_steps: 2000             # For Colab test
eval_steps: 200             # Evaluate every 200 steps
save_steps: 200             # Save checkpoint every 200 steps
seed: 42

# Dataset
max_length: 512

# Mixed precision
mixed_precision: true
use_compile: false

# Logging
enable_progress_bar: true
num_sanity_val_steps: 0

# Early stopping to prevent overfitting during testing
enable_early_stopping: true
early_stopping_patience: 3  # Stop if no improvement for 3 evals
early_stopping_metric: val_loss
