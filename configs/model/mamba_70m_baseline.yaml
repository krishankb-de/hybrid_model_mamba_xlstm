# Mamba-only 70M baseline configuration
# For controlled comparison with the Hybrid 70M model at same dim and depth.
# Only the layer_pattern differs — all layers are Mamba (no xLSTM).

model_type: "hybrid_lm"

# Architecture — SAME dim and depth as hybrid_70m for fair comparison
vocab_size: 50257
dim: 512
num_layers: 8
layer_pattern: ["mamba"]   # ← Pure Mamba, no xLSTM layers

# Mamba parameters (identical to hybrid_70m)
state_size: 16
conv_size: 4
expand_factor: 2
dt_rank: null     # Auto: 512 / 16 = 32
use_fast_path: true

# Operator selection (MAMBA3_PLAN_V2.md V1-E). Declared explicitly in every model yaml so no
# config inherits the dataclass default silently: "legacy" reproduces every checkpoint trained
# before 2026-09 byte-for-byte (including the divide-and-clamp defect, analysis/scan_error_bound.md);
# "exact" is the division-free fix (M1-E / M1-H). The M7 screen and every published number ran legacy.
scan_impl: "legacy"
tfla_impl: "legacy"

# mLSTM parameters (not used, but required by config schema)
head_dim: 64
num_heads: 8
use_tfla: true
proj_factor: 2

# sLSTM parameters (not used)
slstm_hidden_dim: 512
slstm_num_heads: 4
use_exponential_gate: true

# Shared parameters (identical to hybrid_70m)
norm_type: "rms"
use_mlp: true
mlp_ratio: 4.0

# Training parameters (identical to hybrid_70m)
max_position_embeddings: 2048
dropout: 0.1
initializer_range: 0.02

# Generation
use_cache: true
tie_word_embeddings: false

# Optimization (identical to hybrid_70m for fair comparison)
learning_rate: 6.0e-4
weight_decay: 0.1
warmup_steps: 1000
max_steps: 50000
gradient_clip_val: 1.0
