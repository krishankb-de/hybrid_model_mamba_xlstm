# Main configuration file - Hydra entry point
# Override with: python train.py model=hybrid_7b dataset=c4

defaults:
  - model: hybrid_350m
  - dataset: wikitext
  - trainer: single_gpu
  - callbacks: default
  - distill: null   # optional; override with distill=stage0_biomedlm or distill=stage1_pubmedbert
  - _self_

# Global settings
seed: 42
debug: false
project_name: "hybrid-xmamba"
experiment_name: "default"

# Weights & Biases logging
wandb:
  enabled: false
  entity: null  # Set your W&B entity
  project: ${project_name}
  name: ${experiment_name}
  tags: []

# Paths
data_dir: "./data"
output_dir: "./outputs/${experiment_name}"
checkpoint_dir: "${output_dir}/checkpoints"
log_dir: "${output_dir}/logs"

# Contrastive training mode: "simcse" (Stage 1) or "clip" (Stage 2)
contrastive_mode: simcse

# Phase 10E — decoder init checkpoint for report-generation training
# (scripts/train_report_generation.py). Same declared-key requirement as
# config_70m.yaml's lm_checkpoint: Hydra's strict-struct mode rejects a CLI
# override for an undeclared key (caught live 2026-08-23, job 2478635).
decoder_checkpoint: null

# Reproducibility
deterministic: false
benchmark: true
