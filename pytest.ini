# pytest configuration

[tool:pytest]
testpaths = tests
python_files = test_*.py
python_classes = Test*
python_functions = test_*
addopts = 
    -v
    --strict-markers
    --tb=short
    --disable-warnings

markers =
    slow: slow tests
    e2e: the chat page in a real Chrome (tests/e2e)
    cuda: tests requiring CUDA
    willi_parity: tests that validate Python 3.9.23 / willi server compatibility
